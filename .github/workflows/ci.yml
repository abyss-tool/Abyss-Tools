name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 构建 + 单元测试 ────────────────────────────────────────────────────
  # 本仓库不做本地编译：全部编译验证走 GitHub Actions（ubuntu-latest 自带
  # Android SDK cmdline-tools，Gradle 8.14 wrapper 自动拉取发行版）。
  # debug + release 双变体：release 用入库 keystore 签名（指纹恒定，发布
  # 流水线复用同一配置 —— CI 绿即代表可发布）。
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug + release APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: abyss-tools-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: abyss-tools-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # ── 更新通道清单校验（防手写 JSON 漂移）────────────────────────────────
  # 夹具 schema / 插件索引完整性 / changelog 序 / 版本三处同步（build.gradle
  # ↔ AppInfo）/ tools 脚本语法。发布仓与插件中心仓另有同款校验，三处同构。
  manifests:
    name: Validate Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate update-channel & plugin fixtures & version sync
        run: python3 tools/validate_manifests.py
