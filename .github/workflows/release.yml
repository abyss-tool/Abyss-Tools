name: Release

# 发布流水线（双仓库模式，对齐 Android-Guru-Agent 体系）：
#   开发仓（本仓）tag → 构建 release APK（secrets 注入签名材料，指纹恒定）→
#   发布仓（Abyss-Tools-Release）创建 GitHub Release + 上传 APK 资产 →
#   同步 version.json / patches.json / changelog.json → 客户端「检查更新」
#   即刻可发现并下载安装（PackageInstaller 网关同签名门禁 + 发布者指纹
#   硬校验恒定通过）。
#
# 触发：
#   - push tag v*（推荐：版本号以 AppInfo.kt 为单一事实源，tag 必须等于
#     v{AppInfo.VERSION_NAME}）
#   - workflow_dispatch（从 AppInfo.kt 读当前版本发布，tag 缺省推导）
#
# 需要仓库 secrets：
#   - ABYSS_KEYSTORE_B64 / ABYSS_KEYSTORE_PASSWORD / ABYSS_KEY_ALIAS /
#     ABYSS_KEY_PASSWORD（发布签名材料，v0.6.0 起 jks 出库）
#   - RELEASE_TOKEN（发布仓写入 + Release 创建；建议 fine-grained PAT
#     只授目标发布仓 Contents 写权限）

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notes:
        description: '更新要点（分号分隔，多条）'
        required: false
        default: ''
      channel:
        description: '通道标识'
        required: false
        default: 'framework-preview'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── 版本纪律：AppInfo.kt 单一事实源，build.gradle.kts 由其推导 ──
      # （tag 必须与 AppInfo.VERSION_NAME 一致；manifests job 另有结构性校验）
      - name: Verify version sync & resolve tag
        id: version
        run: |
          APPINFO_VERSION=$(grep -oP 'VERSION_NAME:\s*String\s*=\s*"\K[^"]+' core/common/src/main/kotlin/com/abyss/tools/core/common/AppInfo.kt)
          APPINFO_CODE=$(grep -oP 'VERSION_CODE:\s*Int\s*=\s*\K\d+' core/common/src/main/kotlin/com/abyss/tools/core/common/AppInfo.kt)
          echo "appinfo: v$APPINFO_VERSION ($APPINFO_CODE)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [ "$TAG" != "v$APPINFO_VERSION" ]; then
              echo "::error::tag($TAG) 与 AppInfo.VERSION_NAME(v$APPINFO_VERSION) 不一致"; exit 1
            fi
          else
            TAG="v$APPINFO_VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$APPINFO_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$APPINFO_CODE" >> "$GITHUB_OUTPUT"

      # ── 发布签名材料注入（评审 P0-1：jks / 口令出库，经 secrets）────
      - name: Decode release keystore (secrets)
        env:
          ABYSS_KEYSTORE_B64: ${{ secrets.ABYSS_KEYSTORE_B64 }}
        run: |
          if [ -z "$ABYSS_KEYSTORE_B64" ]; then
            echo "::error::缺少 ABYSS_KEYSTORE_B64 secret —— 发布流水线必须有签名材料（fail-closed）"
            exit 1
          fi
          SIGNING_DIR="$RUNNER_TEMP/abyss-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$ABYSS_KEYSTORE_B64" | base64 -d > "$SIGNING_DIR/release.jks"
          echo "ABYSS_KEYSTORE_FILE=$SIGNING_DIR/release.jks" >> "$GITHUB_ENV"
          echo "release 签名材料已注入（未回显任何机密值）"

      - name: Assemble release APK (signed)
        env:
          ABYSS_KEYSTORE_PASSWORD: ${{ secrets.ABYSS_KEYSTORE_PASSWORD }}
          ABYSS_KEY_ALIAS: ${{ secrets.ABYSS_KEY_ALIAS }}
          ABYSS_KEY_PASSWORD: ${{ secrets.ABYSS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # ── 发布前强制门禁：发布者指纹必须命中内置常量（fail-closed）────
      - name: Enforce publisher fingerprint (apksigner)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::runner 上未找到 apksigner —— 无法完成发布指纹门禁"
            exit 1
          fi
          FINGERPRINT=$("$APKSIGNER" verify --print-certs "$APK" | grep -oP 'SHA-256 digest:\s*\K[0-9a-f]+' | head -1 | tr 'a-f' 'A-F')
          EXPECTED=$(echo "76:03:78:21:44:88:D6:20:79:78:BA:1E:37:E6:DC:82:AB:C2:DE:72:C9:F6:C6:7D:9B:44:95:15:8A:99:B7:69" | tr -d ':')
          echo "实际指纹: $FINGERPRINT"
          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "::error::发布 APK 指纹与 PublisherSignatures.PINNED_SHA256 不符 —— 拒绝发布"
            exit 1
          fi
          echo "✓ 发布指纹门禁通过"

      - name: Locate release APK
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"
          sha256sum "$APK"

      - name: Publish to Abyss-Tools-Release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # 参数化传参（评审 #3：删除 eval 拼接 —— 输入里的引号 / $(…) /
          # 反引号原样进入 argv，不再进入 shell 求值上下文）
          args=(
            --tag "${{ steps.version.outputs.tag }}"
            --version-code "${{ steps.version.outputs.version_code }}"
            --apk "${{ steps.apk.outputs.path }}"
            --channel "${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'stable' }}"
            --commit-sha "${{ github.sha }}"
          )
          NOTES_INPUT="${{ github.event_name == 'workflow_dispatch' && inputs.notes || '' }}"
          if [ -n "$NOTES_INPUT" ]; then
            IFS=';' read -ra NOTES <<< "$NOTES_INPUT"
            for n in "${NOTES[@]}"; do
              [ -n "$n" ] && args+=(--notes "$n")
            done
          elif [ -f "docs/release-notes/v${{ steps.version.outputs.version_name }}.md" ]; then
            # tag 发布：发布要点来自 docs/release-notes/v<version>.md（一行一条）
            while IFS= read -r n; do
              [ -n "$n" ] && args+=(--notes "$n")
            done < "docs/release-notes/v${{ steps.version.outputs.version_name }}.md"
          fi
          python3 tools/publish_release.py "${args[@]}"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: abyss-tools-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
