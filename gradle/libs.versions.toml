[versions]
# 工具链矩阵与 Android-Guru-Agent（Ultra-Guru/Android-Guru-Agent）已验证矩阵完全对齐：
# vendored backdrop（Kyant0/AndroidLiquidGlass 上游 1.0.0 血统 + 热修）在该矩阵下
# 经 GitHub Actions 全链路编译验证，本仓直接复用，避免重新踩版本组合坑。
kotlin = "2.3.21"
agp = "8.13.2"
# Compose BOM 2026.02.00（Compose 1.10.3 / material3 1.4.0）：vendored backdrop
# 的 GraphicsLayer / RenderEffect / Modifier.Node / RuntimeShader 桥接 API 需求
# 在该线下向后兼容（Compose 二进制兼容承诺 + 参考仓 CI 实证）。
compose-bom = "2026.02.00"
activity-compose = "1.9.3"
lifecycle = "2.8.7"
core-ktx = "1.15.0"
coroutines = "1.10.2"
# serialization 1.9.0：以 Kotlin 2.1.21 构建，Kotlin 2.3.21 消费端完全兼容
serialization = "1.9.0"
okhttp = "4.12.0"
# material-icons 官方已停止演进（BOM 2026.02.00 仍映射 1.7.8），显式 pin 同值
compose-material-icons = "1.7.8"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "compose-material-icons" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "compose-material-icons" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
